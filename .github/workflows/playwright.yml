name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
      # Daily at 10:00 AM IST
      - cron: '30 4 * * *'

      # Weekly on Monday at 11:00 AM IST
      - cron: '30 5 * * 0'

      # Alternate days at 12:00 PM IST
      - cron: '30 6 */2 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Create .env file with email configuration
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: |
        echo "GMAIL_USER=$GMAIL_USER" > .env
        echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env
        echo "RECIPIENT_EMAIL=$RECIPIENT_EMAIL" >> .env
        echo "TEST_REPORT_TITLE=GitHub Actions - Playwright Test Report" >> .env

    # ✅ Install ONLY Chromium (Chrome)
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    # ✅ Run tests ONLY on Chrome project
    - name: Run Playwright tests (Chrome)
      run: |
        echo "🚀 Starting Playwright tests..."
        echo "📧 Email notification will be sent when tests start..."
        npx playwright test --project="Google Chrome"
        echo "✅ Tests completed!"
        echo "📧 Email notification with test report will be sent..."

    - name: Verify Test Execution and Email Notifications
      if: ${{ !cancelled() }}
      run: |
        echo "📊 Test Execution Summary:"
        echo "=========================="
        if [ -f playwright-report/index.html ]; then
          echo "✅ Test report generated"
          # Extract test counts from HTML report
          if grep -q "passed" playwright-report/index.html; then
            echo "✅ Tests executed successfully"
            echo "📧 START email: Sent before tests began"
            echo "📧 END email: Sent with test report attachment"
          fi
        else
          echo "⚠️ Test report not found - check test execution logs"
        fi

    - name: Upload test report as artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Test Report Summary
      if: ${{ !cancelled() }}
      run: |
        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "✅ PLAYWRIGHT TEST EXECUTION COMPLETED"
        echo "════════════════════════════════════════════════════════════"
        echo ""
        if [ -f playwright-report/index.html ]; then
          echo "✅ Test report generated successfully"
          echo "📧 Emails sent:"
          echo "   • START email: Sent when tests began"
          echo "   • END email: Sent with test report attached to ${{ secrets.RECIPIENT_EMAIL }}"
          echo ""
          echo "📊 Test Report Location: playwright-report/index.html"
          echo "📎 Artifact: Download 'playwright-report' from GitHub Actions"
        else
          echo "⚠️ Test report not found"
          echo "⚠️ Email notifications may not have been sent"
        fi
        echo ""
        echo "════════════════════════════════════════════════════════════"
